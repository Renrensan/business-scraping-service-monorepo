name: business-scraping-service

services:
  postgresdb:
    container_name: bizscrape_pgdb
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-bizscrape_db}
    ports:
      - "5434:5432"
    volumes:
      - bizscrape_postgres_data:/var/lib/postgresql/data
    networks:
      - bizscrape_network

  redis:
    container_name: bizscrape_redis
    image: redis:alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--loglevel", "warning"]
    ports:
      - "6380:6379"
    volumes:
      - bizscrape_redis_data:/data
    networks:
      - bizscrape_network

networks:
  bizscrape_network:
    driver: bridge

volumes:
  bizscrape_postgres_data:
  bizscrape_redis_data:
