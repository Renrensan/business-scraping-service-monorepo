[tools]
go = "1.23.6"
node = "22.22.1"
pnpm = "11.13.0"

[env]
_.file = ".env"

# DOCKER PREREQUISITE
[tasks.check-docker]
run = "docker info >/dev/null 2>&1 || (echo 'Docker is not running' && exit 1)"

# Local DB & Redis Run (using Docker)
[tasks.db-run-dev]
description = "Run Postgres DB and Redis using Docker from docker-compose"
run = "docker start bizscrape_pgdb bizscrape_redis 2>/dev/null || docker-compose up -d postgresdb redis"
depends = ["check-docker"]

[tasks.db-stop]
description = "Stop Postgres DB and Redis containers"
run = "docker-compose down"

# DEV TASKS
[tasks.dev-backend]
description = "Run Go backend API server in dev mode"
run = "cd backend && go run cmd/server/main.go"
depends = ["db-run-dev"]

[tasks.dev-frontend]
description = "Run Svelte 5 frontend app in dev mode"
run = "cd frontend && pnpm dev"

[tasks.dev]
description = "Run both backend and frontend concurrently in development mode"
depends = ["dev-backend", "dev-frontend"]

# BUILD TASKS (LOCAL)
[tasks.build-backend]
description = "Compile Go backend binary"
run = "cd backend && go build -o bin/server cmd/server/main.go"

[tasks.build-frontend]
description = "Build Svelte 5 production bundle"
run = "cd frontend && pnpm build"

[tasks.build]
description = "Build both backend and frontend"
depends = ["build-backend", "build-frontend"]

# TEST TASKS
# Image builds depend on these, so a failing build is never pushed.
[tasks.test-backend]
description = "Vet and test the Go backend (set TEST_DATABASE_URL to include database tests)"
run = "cd backend && go vet ./... && go test ./..."

[tasks.test-frontend]
description = "Run SvelteKit typecheck and diagnostics"
run = "cd frontend && pnpm check"

[tasks.test]
description = "Run all backend and frontend tests"
depends = ["test-backend", "test-frontend"]

# DOCKER PRODUCTION BUILD & PUSH (TARGET: LINUX)
[tasks.docker-build-backend]
description = "Build Linux Docker image for Go backend"
run = "cd backend && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags=\"-w -s\" -o bin/server ./cmd/server/main.go && docker build --platform linux/amd64 -t renrensan/momos-scraper-backend:latest ."
depends = ["check-docker", "test-backend"]


[tasks.docker-build-frontend]
description = "Build Linux Docker image for Svelte frontend"
run = "cd frontend && pnpm build && docker build --platform linux/amd64 -t renrensan/momos-scraper-frontend:latest ."
depends = ["check-docker", "test-frontend"]


[tasks.docker-build]
description = "Build all Linux Docker images for production"
depends = ["docker-build-backend", "docker-build-frontend"]

[tasks.docker-push-backend]
description = "Push backend Linux image to Docker Hub"
run = "docker push renrensan/momos-scraper-backend:latest"
depends = ["docker-build-backend"]

[tasks.docker-push-frontend]
description = "Push frontend Linux image to Docker Hub"
run = "docker push renrensan/momos-scraper-frontend:latest"
depends = ["docker-build-frontend"]

[tasks.docker-push]
description = "Build and push all Linux Docker images to Docker Hub"
depends = ["docker-push-backend", "docker-push-frontend"]

[tasks.docker-release]
description = "Alias to build and push all Linux images to Docker Hub"
depends = ["docker-push"]

